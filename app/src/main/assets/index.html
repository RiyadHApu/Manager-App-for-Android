<script>
(function(){
'use strict';
const KEY='deskbook.v1';
const ACC=[['green','Green','#0d6e6a'],['red','Red','#c62828'],['yellow','Yellow','#f2b705'],['orange','Orange','#e65100'],['pink','Pink','#c2185b'],['purple','Purple','#6a1b9a'],['indigo','Indigo','#283593'],['blue','Blue','#1565c0'],['cyan','Cyan','#00838f'],['slate','Slate','#37474f']];
const applyAccent=k=>{document.documentElement.setAttribute('data-accent',ACC.some(a=>a[0]===k)?k:'green')};
try{applyAccent(localStorage.getItem('deskbook.accent'))}catch(e){applyAccent('green')}
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return iso(d)};
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fdate=s=>{if(!s)return '';const [y,m,d]=s.split('-');return `${+d} ${MON[+m-1]} ${y}`};

/* ---------- data ---------- */
function blank(){return {v:1,sample:false,
  settings:{photo:'',company:'My Company',cur:'৳',tax:0,pS:'INV-',pP:'BILL-',models:[],locations:[]},
  accounts:[{id:'cash',name:'Cash in hand',open:0},{id:'bank',name:'Bank account',open:0}],
  seq:{sales:0,purchases:0},parties:[],items:[],sales:[],purchases:[],payments:[],adjustments:[],assets:[],investments:[]}}
function sample(){
  const d=blank();d.sample=true;d.settings.company='Sample Trading Co.';d.settings.tax=5;
  d.accounts[0].open=25000;d.accounts[1].open=400000;
  const P=(t,n,ph,em,ad)=>{const p={id:uid(),type:t,name:n,phone:ph,email:em,addr:ad};d.parties.push(p);return p.id};
  const c1=P('c','Lakeview Eye Hospital','+880 1700 000001','accounts@lakeview.example','Dhaka');

/* ---------- calculations ---------- */
const money=n=>{n=+n||0;const s=Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});return (n<-0.004?'-':'')+db.settings.cur+' '+s};
const qty=n=>(+n||0).toLocaleString('en-US',{maximumFractionDigits:2});
const lineNet=l=>num(l.qty)*num(l.price)*(1-num(l.disc)/100);
const subOf=d=>d.lines.reduce((a,l)=>a+lineNet(l),0);
const taxOf=d=>subOf(d)*num(d.tax)/100;
const totOf=d=>subOf(d)+taxOf(d);
const paidOf=id=>db.payments.filter(p=>p.docId===id).reduce((a,p)=>a+p.amount,0);
const balOf=d=>totOf(d)-paidOf(d.id);
function statusOf(d){const b=balOf(d);if(b<=0.005)return 'Paid';if(d.due&&d.due<today())return 'Overdue';return paidOf(d.id)>0.005?'Part paid':'Unpaid'}
const pillCls=s=>({'Paid':'paid','Overdue':'overdue','Unpaid':'unpaid','Part paid':'part'}[s]);
const party=id=>db.parties.find(p=>p.id===id);
const pname=id=>(party(id)||{name:'(deleted)'}).name;
const acct=id=>db.accounts.find(a=>a.id===id);
function itemStats(it){let pq=0,pv=0,sq=0;
  db.purchases.forEach(d=>d.lines.forEach(l=>{if(l.itemId===it.id){pq+=num(l.qty);pv+=lineNet(l)}}));
  db.sales.forEach(d=>d.lines.forEach(l=>{if(l.itemId===it.id)sq+=num(l.qty)}));
  let aq=0;(db.adjustments||[]).forEach(a=>{if(a.itemId===it.id)aq+=num(a.qty)});
  const oq=num(it.opening),base=oq+pq,avg=base>0?(oq*num(it.cost)+pv)/base:num(it.cost),q=base-sq+aq;
  const unit=avg>0?avg:num(it.price);
  return {qty:q,avg:avg,value:Math.max(q,0)*unit,costVal:Math.max(q,0)*avg,sellVal:Math.max(q,0)*num(it.price),sold:sq}}
function partyBal(p){const list=p.type==='c'?db.sales:db.purchases;return list.filter(d=>d.partyId===p.id).reduce((a,d)=>a+balOf(d),0)}
function acctBal(a){let b=num(a.open);db.payments.forEach(p=>{if(p.accountId!==a.id)return;b+=p.kind==='in'?p.amount:-p.amount});
  (db.assets||[]).forEach(x=>{if(x.accountId===a.id)b-=num(x.cost);if(x.status==='Sold'&&x.soldAccount===a.id)b+=num(x.soldAmount)});
  (db.investments||[]).forEach(i=>{if(i.accountId===a.id)b-=num(i.amount);if(i.status!=='Active'&&i.proceedsAccount===a.id)b+=num(i.proceeds);(i.returns||[]).forEach(r=>{if(r.accountId===a.id)b+=num(r.amount)})});
  return b}
const listVals=k=>{const key=k==='model'?'models':'locations';const set=new Set(db.settings[key]||[]);db.items.forEach(i=>{if(i[k])set.add(i[k])});return [...set].sort((a,b)=>a.localeCompare(b))};
/* fixed assets: straight-line depreciation */
function assetDep(a){const cost=num(a.cost),salv=num(a.salvage),life=num(a.life);if(!a.date||life<=0)return 0;
  const end=a.status==='Sold'&&a.soldDate?a.soldDate:today();const yrs=Math.max(0,(new Date(end)-new Date(a.date))/(365.25*864e5));
  return Math.max(0,Math.min(cost-salv,(cost-salv)*yrs/life))}
const assetBook=a=>Math.max(num(a.cost)-assetDep(a),0);
const assetCarry=a=>a.status==='Sold'?0:assetBook(a);
const invReturns=i=>(i.returns||[]).reduce((a,r)=>a+num(r.amount),0);
const invValue=i=>i.status==='Active'?num(i.value):0;
const invProfit=i=>(i.status==='Active'?num(i.value):num(i.proceeds))+invReturns(i)-num(i.amount);
function netWorth(){const cash=db.accounts.reduce((a,x)=>a+acctBal(x),0),rec=db.sales.reduce((a,d)=>a+balOf(d),0),pay=db.purchases.reduce((a,d)=>a+balOf(d),0),
  stock=db.items.reduce((a,i)=>a+itemStats(i).value,0),fa=db.assets.reduce((a,x)=>a+assetCarry(x),0),inv=db.investments.reduce((a,x)=>a+invValue(x),0);
  return {cash:cash,rec:rec,stock:stock,fa:fa,inv:inv,pay:pay,total:cash+rec+stock+fa+inv-pay}}
function range(per){const t=today(),y=t.slice(0,4),m=t.slice(0,7);
  if(per==='month')return [m+'-01',m+'-31'];
  if(per==='last'){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);const s=iso(d).slice(0,7);return [s+'-01',s+'-31']}
  if(per==='year')return [y+'-01-01',y+'-12-31'];
  return ['0000-01-01','9999-12-31']}

/* ---------- reports ---------- */
function profitLoss(r){
  const sales=db.sales.filter(d=>inR(d.date,r));
  const rev=sales.reduce((a,d)=>a+subOf(d),0);
  let cogs=0;const st={};db.items.forEach(i=>st[i.id]=itemStats(i).avg);
  sales.forEach(d=>d.lines.forEach(l=>{if(l.itemId)cogs+=num(l.qty)*(st[l.itemId]||0)}));
  const exp={};db.payments.filter(p=>p.kind==='exp'&&inR(p.date,r)).forEach(p=>{const c=p.category||'Other';exp[c]=(exp[c]||0)+p.amount});
  const ex=Object.values(exp).reduce((a,b)=>a+b,0);
  return {rev:rev,cogs:cogs,gross:rev-cogs,exp:exp,ex:ex,net:rev-cogs-ex}}
const M=n=>({m:n});const Q=n=>({q:n});
function buildReport(){
  const r=range(S.per),t=today();
  if(S.rep==='pl'){const p=profitLoss(r);
    const rows=[['Sales (before tax)',M(p.rev)],['Cost of goods sold',M(-p.cogs)],{b:['Gross profit',M(p.gross)]},{h:['Expenses','']}];
    Object.keys(p.exp).sort().forEach(k=>rows.push(['  '+k,M(-p.exp[k])]));
    if(!Object.keys(p.exp).length)rows.push(['  None recorded','']);
    rows.push({b:['Net profit',M(p.net)]});
    return {head:[['Profit and loss'],['Amount','r']],rows:rows,period:true}}
  if(S.rep==='sales'){const g={};db.sales.filter(d=>inR(d.date,r)).forEach(d=>{const x=g[d.partyId]||(g[d.partyId]={n:0,s:0});x.n++;x.s+=subOf(d)});
    const rows=Object.keys(g).sort((a,b)=>g[b].s-g[a].s).map(k=>[pname(k),Q(g[k].n),M(g[k].s)]);
    const tot=rows.reduce((a,x)=>a+x[2].m,0);rows.push({b:['Total',Q(rows.reduce((a,x)=>a+x[1].q,0)),M(tot)]});
    return {head:[['Customer'],['Invoices','r'],['Sales before tax','r']],rows:rows,period:true}}
  if(S.rep==='ar'||S.rep==='ap'){const type=S.rep==='ar'?'sales':'purchases',g={};
    db[type].forEach(d=>{const b=balOf(d);if(b<=0.005)return;const ref=d.due||d.date;const days=Math.floor((new Date(t)-new Date(ref))/864e5);
      const x=g[d.partyId]||(g[d.partyId]=[0,0,0,0]);x[days<=0?0:days<=30?1:days<=60?2:3]+=b});
    const rows=Object.keys(g).sort((a,b)=>pname(a).localeCompare(pname(b))).map(k=>[pname(k),...g[k].map(M),M(g[k].reduce((a,b)=>a+b,0))]);
    const sum=[0,0,0,0];rows.forEach(r=>r.slice(1,5).forEach((c,i)=>sum[i]+=c.m));
    rows.push({b:['Total',...sum.map(M),M(sum.reduce((a,b)=>a+b,0))]});
    return {head:[[S.rep==='ar'?'Customer':'Supplier'],['Not due','r'],['1–30 days','r'],['31–60 days','r'],['Over 60','r'],['Total','r']],rows:rows}}
  if(S.rep==='nw'){const n=netWorth();

const IMP=[['name','Item name',/name|product|item|descri|particular|material/i],['sku','SKU or code',/sku|code|part|catalog|barcode|ref/i],['model','Model',/model|variant|type|version/i],['location','Inventory location',/location|rack|shelf|bin|warehouse|store|godown|place/i],['unit','Unit',/unit|uom|pack/i],

const cellTxt=v=>String(v==null?'':v).trim();
const numTxt=v=>{const n=parseFloat(String(v==null?'':v).replace(/[^0-9.\-]/g,''));return isFinite(n)?n:0};
function impAuto(s){const hdr=num(s.hdr),h=(s.rows[hdr]||[]).map(cellTxt),used=new Set();
  IMP.forEach(([f,,re])=>{let idx='';for(let i=0;i<h.length;i++){if(!used.has(i)&&h[i]&&re.test(h[i])){idx=i;used.add(i);break}}s['m_'+f]=idx})}
function impHeaderRow(rows){for(let i=0;i<Math.min(rows.length,10);i++){const r=rows[i]||[];if(r.filter(c=>cellTxt(c)).length>=2&&r.some(c=>IMP[0][2].test(cellTxt(c))))return i}return 0}
function impLoad(s,rows){rows=rows.filter(r=>r.some(c=>cellTxt(c)!==''));if(!rows.length){s.err='No rows found in that file.';return}
  s.rows=rows;s.err='';s.hdr=String(impHeaderRow(rows));impAuto(s)}
function impParsed(s){const hdr=num(s.hdr),get=(r,f)=>{const i=s['m_'+f];return i===''||i==null?'':r[+i]};
  return s.rows.slice(hdr+1).map(r=>({name:cellTxt(get(r,'name')),sku:cellTxt(get(r,'sku')),model:cellTxt(get(r,'model')),location:cellTxt(get(r,'location')),comments:cellTxt(get(r,'comments')),unit:cellTxt(get(r,'unit'))||'pc',cost:numTxt(get(r,'cost')),price:numTxt(get(r,'price')),opening:numTxt(get(r,'opening')),reorder:numTxt(get(r,'reorder'))})).filter(x=>x.name)}
function impMatch(list){const bySku=new Map(),byName=new Map();db.items.forEach(i=>{if(i.sku)bySku.set(i.sku.toLowerCase(),i);byName.set(i.name.toLowerCase(),i)});
  return {bySku:bySku,byName:byName,find:x=>(x.sku&&bySku.get(x.sku.toLowerCase()))||byName.get(x.name.toLowerCase())}}

const pickHtml=(src,f,val,ph,blank,l)=>{const cur=PICKSRC[src]().find(x=>x.id===val);
  return `<div class="pk"><input type="search" class="isr" data-src="${src}" data-blank="${esc(blank||'')}" autocomplete="off" value="${esc(cur?cur.label:'')}" placeholder="${esc(ph)}" aria-label="${esc(ph)}"><input type="hidden" data-f="${f}"${l!=null?` data-l="${l}"`:''} data-redraw value="${esc(val||'')}"><div class="sug" hidden></div></div>`};
function wirePicks(bd){bd.querySelectorAll('.isr').forEach(inp=>{const wrap=inp.parentNode,box=wrap.querySelector('.sug'),hid=wrap.querySelector('input[type=hidden]');
  const show=q=>{q=(q||'').trim();const all=PICKSRC[inp.dataset.src](),cur=all.find(x=>x.id===hid.value),qq=cur&&q===cur.label?'':q;
    const m=all.filter(x=>match(qq,...x.hay)).sort((a,b)=>a.label.localeCompare(b.label)).slice(0,400);
    box.innerHTML=m.map(x=>`<button type="button" data-id="${esc(x.id)}"><b>${esc(x.label)}</b>${x.sub?`<small>${esc(x.sub)}</small>`:''}</button>`).join('')+(m.length?'':'<div class="none">No match</div>')+(inp.dataset.blank?`<button type="button" data-id="" class="cu">${esc(inp.dataset.blank)}</button>`:'');
    box.hidden=false;box.scrollTop=0;try{box.scrollIntoView({block:'nearest'})}catch(e){}};
  const hide=()=>setTimeout(()=>{if(!box.contains(document.activeElement)&&document.activeElement!==inp)box.hidden=true},200);
  inp.addEventListener('focus',()=>{inp.select();show('')});
  inp.addEventListener('input',()=>show(inp.value));
  inp.addEventListener('blur',hide);box.addEventListener('focusout',hide);
  box.addEventListener('mousedown',e=>e.preventDefault());
  box.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;hid.value=b.dataset.id;box.hidden=true;hid.dispatchEvent(new Event('change',{bubbles:true}))})})}

  restore:()=>{const v=$('#restore').value.trim();if(!v)return toast('Paste a backup first');let o;
    try{o=JSON.parse(v);if(!o||o.v!==1||!Array.isArray(o.sales))throw 0}catch(e){return toast('That is not a valid backup')}
    if(CLOUD){const b=document.querySelector('[data-act=restore]');if(!b.dataset.sure){b.dataset.sure='1';b.textContent='Tap again: this replaces data on ALL devices';setTimeout(()=>{b.dataset.sure='';b.textContent='Restore from backup'},4000);return}}
    o.adjustments=o.adjustments||[];o.assets=o.assets||[];o.investments=o.investments||[];if(CLOUD){o.seq=db.seq}db=o;render();toast('Backup restored')},
  wipe:function(){const b=document.querySelector('[data-act=wipe]');if(!b.dataset.sure){b.dataset.sure='1';b.textContent='Tap again to erase everything';setTimeout(()=>{b.dataset.sure='';b.textContent='Erase all data'},3500);return}db=blank();render();toast('All data erased')}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||t.closest('#modal'))return;ACT[t.dataset.act]&&ACT[t.dataset.act](t.dataset)});
modal.addEventListener('click',e=>{const t=e.target.closest('tr[data-act]');if(t&&ACT[t.dataset.act]){e.stopPropagation();closeModal();ACT[t.dataset.act](t.dataset)}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('tr[data-act]')){e.preventDefault();e.target.click()}});
document.addEventListener('change',e=>{if(e.target.id!=='photo_file')return;const f=e.target.files&&e.target.files[0];if(!f)return;const img=new Image(),u=URL.createObjectURL(f);
  img.onload=()=>{const n=256,s=Math.min(img.width,img.height),c=document.createElement('canvas');c.width=c.height=n;c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,n,n);URL.revokeObjectURL(u);
    db.settings.photo=c.toDataURL('image/jpeg',.82);render();toast('Profile photo saved')};img.onerror=()=>toast('Could not read that image');img.src=u});
document.addEventListener('change',e=>{const id=e.target.id;if(id==='f_loc'||id==='f_mod'){if(id==='f_loc')S.loc=e.target.value;else S.mod=e.target.value;const l=$('#list');if(l&&S.view==='items')l.innerHTML=LISTS.items()}});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;const l=$('#list');if(l&&LISTS[S.view])l.innerHTML=LISTS[S.view]()}});

/* ---------- cloud sync (Firebase) ---------- */
const COLS=['parties','items','sales','purchases','payments','adjustments','assets','investments'];
const CCOLS=COLS.concat(['meta']);
const FBCFG='deskbook.fbcfg';
const cloud={h:null,user:null,loaded:false,pend:{},err:'',unsubs:[],got:0};
let synced={};
function pushDiff(){
  if(!cloud.h||!cloud.loaded)return;
  const fail=e=>{cloud.err=(e&&e.code)||'error';paintSync();toast('Could not save: '+((e&&e.code)||(e&&e.message)||'error'))};
  COLS.forEach(c=>{const seen=new Set();
    (db[c]||[]).forEach(o=>{seen.add(o.id);const k=c+'/'+o.id;
      if(synced[k]!==JSON.stringify(o)){o._by=cloud.user&&cloud.user.email||'';o._ts=Date.now();
        const j=JSON.stringify(o);synced[k]=j;FB.set(cloud.h,c,o.id,JSON.parse(j)).catch(fail)}});
    Object.keys(synced).filter(k=>k.startsWith(c+'/')).forEach(k=>{const id=k.slice(c.length+1);
      if(!seen.has(id)){delete synced[k];FB.del(cloud.h,c,id).catch(fail)}})});
  const m=JSON.stringify({settings:db.settings,accounts:db.accounts});
  if(synced['meta/main']!==m){synced['meta/main']=m;FB.set(cloud.h,'meta','main',JSON.parse(m)).catch(fail)}}
function applySnap(c,snap){
  if(c==='meta'){snap.docs.forEach(d=>{
    if(d.id==='main'){if(d.data.settings)Object.assign(db.settings,d.data.settings);if(d.data.accounts)db.accounts=d.data.accounts;
      synced['meta/main']=JSON.stringify({settings:db.settings,accounts:db.accounts})}
    if(d.id==='counters'){db.seq.sales=d.data.sales||0;db.seq.purchases=d.data.purchases||0}});return}
  const by=new Map(db[c].map(o=>[o.id,o])),ids=new Set();
  snap.docs.forEach(d=>{ids.add(d.id);let o=by.get(d.id);const data=Object.assign({},d.data,{id:d.id});
    if(o){if(JSON.stringify(o)!==JSON.stringify(data)){Object.keys(o).forEach(k=>delete o[k]);Object.assign(o,data)}}
    else{o=data;db[c].push(o)}
    synced[c+'/'+d.id]=JSON.stringify(o)});
  db[c]=db[c].filter(o=>ids.has(o.id)||!(c+'/'+o.id in synced));
  Object.keys(synced).forEach(k=>{if(k.startsWith(c+'/')&&!ids.has(k.slice(c.length+1)))delete synced[k]})}
function paintSync(){const e=$('#sync');if(!e)return;const off=!navigator.onLine,pend=Object.values(cloud.pend).some(Boolean);
  e.className='pill '+(cloud.err?'overdue':off?'unpaid':pend?'part':'paid');
  e.textContent=cloud.err?'Sync problem':off?'Offline':pend?'Syncing…':'Synced'}
window.addEventListener('online',()=>{if(CLOUD)paintSync()});window.addEventListener('offline',()=>{if(CLOUD)paintSync()});
let rt;function scheduleRender(){clearTimeout(rt);rt=setTimeout(()=>{if(!cloud.loaded)return;
  const a=document.activeElement;
  if(a&&a.matches&&a.matches('input,textarea,select')&&$('#view').contains(a)){const l=$('#list');if(l&&LISTS[S.view])l.innerHTML=LISTS[S.view]();paintSync();return}
  render()},60)}
function fmtNo(type,n){return (type==='sales'?db.settings.pS:db.settings.pP)+String(n).padStart(4,'0')}
async function allocNo(type){
  const p=type==='sales'?db.settings.pS:db.settings.pP;
  const temp=()=>{toast('Offline: a temporary invoice number was used');return p+today().slice(2).replace(/-/g,'')+'-'+Math.random().toString(36).slice(2,5).toUpperCase()};
  if(!navigator.onLine)return temp();
  try{for(let i=0;i<8;i++){
    const n=await Promise.race([FB.alloc(cloud.h,type),new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),6000))]);
    const no=fmtNo(type,n);if(!db[type].some(d=>d.no===no))return no}}catch(e){}
  return temp()}
/* sign-in gate */
function showGate(html){const g=$('#gate');g.hidden=false;g.innerHTML='<div class="card gate-card">'+html+'</div>'}
function hideGate(){const g=$('#gate');g.hidden=true;g.innerHTML=''}
function gateSetup(msg){showGate(`<h3>Connect to your company cloud</h3><p class="mute">Paste the Firebase web app settings (the <b>firebaseConfig</b> block). You do this once on each device.</p>
  <textarea id="g_cfg" placeholder="const firebaseConfig = {&#10;  apiKey: &quot;...&quot;,&#10;  projectId: &quot;...&quot;&#10;};" style="min-height:150px"></textarea>
  <div class="err" style="text-align:left;flex:none;margin:6px 0">${esc(msg||'')}</div><button class="btn pri" data-g="cfg">Connect</button>`)}
function gateLogin(msg){showGate(`<h3>Sign in</h3><p class="mute">Use the email and password the company owner created for you.</p>
  <div class="f"><div><label for="g_em">Email</label><input id="g_em" type="email" autocomplete="username" autocapitalize="off"></div>
  <div><label for="g_pw">Password</label><input id="g_pw" type="password" autocomplete="current-password"></div></div>
  <div class="err" style="text-align:left;flex:none;margin:6px 0">${esc(msg||'')}</div>
  <button class="btn pri" data-g="login">Sign in</button> <button class="btn" data-g="proj">Use a different cloud project</button>`)}
function parseCfg(t){const o={};String(t).replace(/["']?(\w+)["']?\s*:\s*["']([^"']+)["']/g,(m,k,v)=>{o[k]=v;return m});return o.apiKey&&o.projectId?o:null}
function endListen(){cloud.unsubs.forEach(u=>{try{u()}catch(e){}});cloud.unsubs=[];cloud.loaded=false;cloud.got=0;cloud.pend={};synced={};db=blank()}
function beginListen(){
  endListen();showGate('<p class="mute">Loading company data…</p>');const first={};
  CCOLS.forEach(c=>{cloud.unsubs.push(FB.listen(cloud.h,c,snap=>{
    applySnap(c,snap);cloud.pend[c]=snap.pending;cloud.err='';
    if(!first[c]){first[c]=1;cloud.got++;if(cloud.got===CCOLS.length){cloud.loaded=true;hideGate();render()}}
    scheduleRender()},
    err=>{if(err&&err.code==='permission-denied'){showGate('<h3>Access not allowed</h3><p class="mute">This account is not allowed to use the database. Check that the Firestore rules from the latest README are published.</p><button class="btn" data-g="out">Sign out</button>')}
      else{cloud.err=(err&&err.code)||'error';paintSync()}}))})}
/* The first business (created before multi-business support) stays at the top level of the database for this account.
   Every other sign-in gets its own private space under biz/<uid>/ so the data of different businesses never mixes. */
const LEGACY_OWNER='rhapu95@gmail.com';
function startCloud(){
  let cfg=null;try{cfg=JSON.parse(localStorage.getItem(FBCFG)||'null')}catch(e){}
  if(!cfg)return gateSetup();
  try{cloud.h=FB.init(cfg)}catch(e){try{localStorage.removeItem(FBCFG)}catch(x){}return gateSetup('Those settings did not work: '+e.message)}
  showGate('<p class="mute">Starting…</p>');
  FB.onAuth(cloud.h,u=>{if(u){cloud.user=u;cloud.h.base=(u.email||'').toLowerCase()===LEGACY_OWNER?'':'biz/'+u.uid+'/';beginListen()}else{cloud.user=null;endListen();gateLogin()}})}
document.addEventListener('click',e=>{const t=e.target.closest('[data-g]');if(!t)return;const g=t.dataset.g;
  if(g==='cfg'){const c=parseCfg($('#g_cfg').value);if(!c)return gateSetup('Could not find apiKey and projectId in what you pasted.');
    try{localStorage.setItem(FBCFG,JSON.stringify(c))}catch(x){}startCloud()}
  if(g==='login'){const em=$('#g_em').value.trim(),pw=$('#g_pw').value;if(!em||!pw)return;t.disabled=true;
    FB.signIn(cloud.h,em,pw).catch(err=>{const c=(err&&err.code)||'';gateLogin(/invalid|wrong|user-not-found/.test(c)?'Wrong email or password.':/network/.test(c)?'No internet connection.':'Could not sign in ('+(c||err.message)+').')})}
  if(g==='proj'||g==='out'){if(g==='proj'){try{localStorage.removeItem(FBCFG)}catch(x){}location.reload()}else FB.signOut(cloud.h)}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='g_pw'){const b=document.querySelector('[data-g=login]');b&&b.click()}});

/* ---------- passcode lock (4 to 8 digits, kept on this device) ---------- */
const PINKEY='bm.pin';let pinBuf='',pinTries=0,pinLockUntil=0,skipLock=false;
function pinRec(){try{return JSON.parse(localStorage.getItem(PINKEY)||'null')}catch(e){return null}}
function pinIsSet(){return !!pinRec()}
async function pinHash(p,salt){const t=salt+':'+p;
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){let x=5381;for(let i=0;i<t.length;i++)x=((x<<5)+x+t.charCodeAt(i))|0;return 'w'+x}}
async function pinSave(p){const s=Math.random().toString(36).slice(2)+Date.now().toString(36);
  try{localStorage.setItem(PINKEY,JSON.stringify({s:s,h:await pinHash(p,s)}))}catch(e){toast('Could not save the passcode on this device')}}
async function pinCheck(p){const r=pinRec();return !!r&&/^\d{4,8}$/.test(p)&&await pinHash(p,r.s)===r.h}
function pinClear(){try{localStorage.removeItem(PINKEY)}catch(e){}hidePin()}
function pinPaint(msg){const d=$('#pindots');if(d)d.textContent='●'.repeat(pinBuf.length);const m=$('#pinmsg');if(m&&msg!=null)m.textContent=msg}
function showPin(msg){if(!pinIsSet())return;let o=$('#pinov');
  if(!o){o=document.createElement('div');o.id='pinov';o.setAttribute('role','dialog');o.setAttribute('aria-modal','true');
    o.innerHTML='<div class="pbox"><div class="pt">Business Manager</div><div class="ps" id="pinmsg">Enter your passcode</div><div class="pd" id="pindots"></div><div class="pk">'+
      [1,2,3,4,5,6,7,8,9].map(n=>'<button data-pk="'+n+'">'+n+'</button>').join('')+'<button data-pk="back" aria-label="Delete">&#9003;</button><button data-pk="0">0</button><button class="ok" data-pk="ok">OK</button></div><button class="plink" data-pk="forgot">Forgot passcode?</button></div>';
    document.body.appendChild(o);
    o.addEventListener('click',e=>{const b=e.target.closest('[data-pk]');if(b)pinKey(b.dataset.pk)})}
  o.hidden=false;pinBuf='';pinPaint(msg||'Enter your passcode')}
function hidePin(){const o=$('#pinov');if(o)o.hidden=true;pinBuf='';pinTries=0}
async function pinKey(k){
  if(Date.now()<pinLockUntil)return;
  if(k==='back'){pinBuf=pinBuf.slice(0,-1);return pinPaint()}
  if(k==='forgot'){if(!confirm('This removes the passcode and signs you out. Then sign in again with your email and password.'))return;
    pinClear();if(CLOUD){try{FB.signOut(cloud.h)}catch(e){}}return}
  if(k==='ok'){if(pinBuf.length<4)return pinPaint('Enter 4 to 8 digits');
    if(await pinCheck(pinBuf)){pinTries=0;return hidePin()}
    pinBuf='';pinTries++;
    if(pinTries>=5){pinTries=0;pinLockUntil=Date.now()+30000;pinPaint('Too many wrong tries. Wait 30 seconds.');setTimeout(()=>pinPaint('Enter your passcode'),30000);return}
    return pinPaint('Wrong passcode. Try again.')}
  if(/^\d$/.test(k)&&pinBuf.length<8){pinBuf+=k;pinPaint()}}
document.addEventListener('keydown',e=>{const o=$('#pinov');if(!o||o.hidden)return;
  if(/^\d$/.test(e.key))pinKey(e.key);else if(e.key==='Backspace')pinKey('back');else if(e.key==='Enter')pinKey('ok')});
document.addEventListener('click',e=>{if(e.target.matches&&e.target.matches('input[type=file]')){skipLock=true;setTimeout(()=>{skipLock=false},6000)}},true);
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){if(!skipLock&&pinIsSet())showPin()}else skipLock=false});
if(pinIsSet())showPin();
render();
if(CLOUD)startCloud();
})();
</script>
